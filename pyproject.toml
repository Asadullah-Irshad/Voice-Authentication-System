[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["Backend/template", "Frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length handled by formatter.
# B008: FastAPI's Depends()/File()/Form() in argument defaults is the intended idiom.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["Backend/tests"]
pythonpath = ["Backend"]
addopts = "-q"
