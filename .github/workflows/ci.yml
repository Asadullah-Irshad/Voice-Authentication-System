name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.6 "uvicorn[standard]==0.34.0" python-multipart==0.0.20 \
                      pydantic-settings==2.7.1 "passlib[bcrypt]==1.7.4" bcrypt==4.2.1 \
                      PyJWT==2.10.1 numpy==1.26.4 pytest==8.3.4 httpx==0.28.1 ruff==0.8.6

      - name: Detect backend folder
        id: detect
        run: |
          if [ -d Backend ]; then echo "dir=Backend" >> "$GITHUB_OUTPUT";
          elif [ -d backend ]; then echo "dir=backend" >> "$GITHUB_OUTPUT";
          else echo "dir=." >> "$GITHUB_OUTPUT"; fi

      - name: Lint with Ruff (non-blocking)
        run: ruff check . || true

      - name: Run tests
        env:
          JWT_SECRET: ci-test-secret
          PYTHONPATH: ${{ steps.detect.outputs.dir }}
        run: |
          if [ -d "${{ steps.detect.outputs.dir }}/tests" ]; then
            python -m pytest "${{ steps.detect.outputs.dir }}/tests"
          else
            echo "No tests directory found — skipping tests."
          fi
