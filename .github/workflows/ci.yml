name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight test dependencies
        # The full ML stack (torch/speechbrain) is heavy and not needed for the
        # unit + API tests, which mock the pipeline. Install just what the tests
        # import so CI stays fast.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.6 "uvicorn[standard]==0.34.0" python-multipart==0.0.20 \
                      pydantic-settings==2.7.1 "passlib[bcrypt]==1.7.4" bcrypt==4.2.1 \
                      PyJWT==2.10.1 numpy==1.26.4 pytest==8.3.4 httpx==0.28.1 ruff==0.8.6

      - name: Ruff (lint)
        run: ruff check Backend

      - name: Ruff (format check)
        run: ruff format --check Backend

      - name: Run tests
        run: pytest
